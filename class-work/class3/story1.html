<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- The page content is written in English. -->

<head>
    <!-- The head contains information about the page, not the visible page content. -->

    <!-- Sets the character encoding so special characters display correctly. -->
    <meta charset="UTF-8">

    <!-- The title appears in the browser tab. -->
    <title>Humans of New York | CART 211 Assessment 5</title>

    <!-- A short description of the page used by search engines. -->
    <meta name="description"
        content="A Humans of New York story: “Ms. America pageant”. Course exercise (CART 211) exploring semantic HTML, CSS grid, and accessible media presentation.">

    <!-- Open Graph metadata controls how the page looks when shared on social media. -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Humans of New York — “Ms. America pageant”">
    <meta property="og:description" content="A Humans of New York story presented for CART 211.">

    <!-- The page URL and image used in social media previews. -->
    <meta property="og:url" content="https://hybrid.concordia.ca/yourname/hony/ms-america.html">
    <meta property="og:image" content="https://hybrid.concordia.ca/yourname/hony/assets/america_pageant_og.jpg">

    <!-- The dimensions and alternative description of the preview image. -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Portrait associated with the Ms. America pageant story">

    <!-- Twitter card metadata controls the appearance of shared links on X. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Humans of New York — “Ms. America pageant”">
    <meta name="twitter:description" content="A Humans of New York story presented for CART 211.">
    <meta name="twitter:image" content="https://hybrid.concordia.ca/yourname/hony/assets/america_pageant_og.jpg">

    <!-- Identifies the preferred URL for this page to search engines. -->
    <link rel="canonical" href="https://hybrid.concordia.ca/yourname/hony/ms-america.html">

    <!-- Adds a small icon to the browser tab. -->
    <link rel="icon" href="assets/favicon.ico">

    <!-- Identifies the author and copyright information. -->
    <meta name="author" content="Clara Fioramore">
    <meta name="copyright" content="Clara Fioramore, student project, 2026">

    <!-- Connects this HTML file to the external CSS stylesheet. -->
    <!-- The CSS controls colours, fonts, spacing, layout, and responsiveness. -->
    <link rel="stylesheet" href="default.css">

    <!-- Makes the page adapt to the width of mobile devices. -->
    <!-- Without this, mobile browsers may display the page as if it were desktop-sized. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Loads Google Fonts that can be used in the CSS stylesheet. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Establishes an early connection to Google Fonts to help them load faster. -->
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <!-- Loads Libre Franklin, another font used by the website. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100;0,400;0,900;1,100;1,900&display=swap"
        rel="stylesheet">

    <!-- Loads Font Awesome, a library of ready-made icons. -->
    <!-- The social media icons and hamburger menu use this library. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <!-- Everything inside the body is part of the visible webpage. -->

    <!-- Main wrapper: groups the page content together. -->
    <!-- CSS uses #wrapper to control the overall width and centre the content. -->
    <div id="wrapper">

        <!-- HEADER: contains the logo and navigation menu. -->
        <header>

            <!-- NAV: contains links that help visitors move around the website. -->
            <nav>

                <!-- Logo: clicking the image takes the visitor to the linked page. -->
                <div class="logo">
                    <a href="#">
                        <!-- The alt attribute describes the image for screen readers. -->
                        <img src="assets/logo.png" alt="Logo" width="110" height="50">
                    </a>
                </div>

                <!-- Navigation links.
                     CSS displays these horizontally on desktop
                     and as a menu panel on smaller screens. -->
                <div class="menu1">

                    <!-- The X button closes the mobile navigation menu. -->
                    <button type="button" class="close-menu" aria-label="Close navigation menu">
                        &times;
                    </button>

                    <!-- Links to other pages of the website. -->
                    <a href="storie1.html" class="menuI">STORIES</a>

                    <!-- This link currently points to the top of the current page. -->
                    <a href="#" class="menuI">SERIES</a>

                    <!-- The active class can be styled differently in the CSS. -->
                    <a href="index.html" class="menuI_active">ABOUT</a>

                </div>

                <!-- Hamburger button: displayed on mobile and tablet screens. -->
                <div class="hamburger-menu">

                    <button type="button" aria-label="Open navigation menu">
                        <!-- Font Awesome displays the three horizontal menu lines. -->
                        <span class="fa fa-bars" aria-hidden="true"></span>
                    </button>

                </div>

            </nav>
        </header>

        <section>

            <article>
                <h1>Humans of New York</h1>
                <h2 class="" stories_title">America Pageant</h2>

                <div class="pict">
                    <figure class="left_stories">
                        <img src="assets/america_pageant.jpg" width="1200px" height="790px" class="im">
                    </figure>
                </div>






            </article>
        </section>
</body>

</html>
