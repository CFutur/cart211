<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Sofia&effect=neon|outline|emboss|shadow-multiple">

    <style>
        body {
            font-family: "Sofia", sans-serif;
            font-size: 30px;
            text-shadow: 3px 3px 5px #250cde;
        }
    </style>

</head>

<body>
    <h1 class="font-effect-emboss">Sofia is embossed</h1>
    <p class="font-effect-outline">Lorem ipsum dolor sit amet is outlined</p>
    <p class="font-effect-neon">1 2 3 4 5 6 7 8 9 0 all neon!!</p>
    <p class="font-effect-shadow-multiple">1 2 3 4 5 6 7 8 9 0 all neon!!</p>
</body>
