<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow video</title>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 20px;
        }

        /*Video size buttons*/
        /*Adds space below the group of buttons*/
        .size-controls {
            margin-bottom: 15px;
        }

        /*Style all buttons inside the size-controls section*/
        .size-controls button {
            padding: 8px 14px;
            /*Adds space inside each button*/
            margin: 3px;
            /*Adds space between buttons*/
            cursor: pointer;
            /*Changes the mouse pointer to a hand */
        }
    </style>
</head>
