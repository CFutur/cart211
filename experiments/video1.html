<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow video</title>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 20px;
        }

        /*Video size buttons*/
        /*Adds space below the group of buttons*/
        .size-controls {
            margin-bottom: 15px;
        }

        /*Style all buttons inside the size-controls section*/
        .size-controls button {
            padding: 8px 14px;
            /*Adds space inside each button*/
            margin: 3px;
            /*Adds space between buttons*/
            cursor: pointer;
            /*Changes the mouse pointer to a hand */
        }

        /*-------------------
        General video player styles 
        -------------------*/

        /*Applies these styles to the video player*/
        video {
            display: block;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            background-color: rgb(0, 0, 0);
            transition: width 0.3s ease;
            /*Makes changes in the video appear smoothly*/
        }


        /*-------------------
        Different video sizes
        -------------------*/

        /*Small video: 320px wide*/
        video.small {
            width: 320px;
        }

        /*medium video: 480*/
        video.medium {
            width: 480px;
        }

        /*720px*/
        video.large {
            width: 720px;
        }

        /*full*/
        video.full {
            width: 100%;
        }
    </style>
</head>

<body>
    <!---->
    <h1>Snowy video</h1>
    <p>Watch the video</p>


    <!--Video size controls buttons-->

    <!--Group buttons together-->
    <div class="size-controls">
        <!--Tells visitors what the buttons control-->
        <strong> Video size:</strong>

        <!--When clicked, calls the javascript function and changes the video width to 320px-->
        <button onclick="changeSize ('small')">
            Small
        </button>

        <!--changes the video width to 480px-->
        <button onclick="changeSize ('medium')">
            Medium
        </button>

        <!--changes the video width to 720px-->
        <button onclick="changeSize ('large')">
            Large
        </button>

        <!--changes the video width to available content width-->
        <button onclick="changeSize ('full')">
            Full Width
        </button>

    </div>

    <!-------------------
    Video player
    ------------------->

    <!-------------------
      id="myVideo" gives the video a unique name that js can use to find it. 
      
      class="full" makes the video start at full width
      
      controls displays the built-in play, pause, volume and other controls
    ------------------->

    <video id="myVideo" class="full" controls>

        <source src="actual-video.mp4" type="video/mp4">
        Sorry, this your browser cannot play this video.
    </video>

    <!--Javascript: Change video size-->

    <script>
        //this function runs whenever a size button is clicked
        //the word "size" receives the value from the button
        //such as "small", "medium", "large" or "full.
        function changeSize(size) {
            //Finds the video element using its unique ID.
            const video = document.getElementById("myVideo");

            //removes all four possible size classes
            //this prevents the old size settings from remaining active.
            video.classList.remove(
                "small",
                "medium",
                "large",
                "full",
            );

            //Adds the new size class selected by the visitor.
            //The CSS then applis the matching width
            video.classList.add(size);
        }

    </script>

</body>

</html>
